<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature Management - CERT-In SBOM Mapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading Digital Signature Management...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
        // This is a placeholder for the signature page
        // In a real implementation, you would build this as a separate React app
        // or use a routing solution like React Router
        
        setTimeout(() => {
            document.querySelector('.loading').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h2>🔐 Digital Signature Management</h2>
                    <p>This page would contain the signature management interface.</p>
                    <p>For now, use the "Signatures (Current Tab)" button in the main app.</p>
                    <button onclick="window.close()" style="
                        background: #3498db;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        cursor: pointer;
                        margin-top: 20px;
                    ">Close Window</button>
                </div>
            `;
        }, 2000);
    </script>
</body>
</html>
