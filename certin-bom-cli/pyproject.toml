[build-system]
requires = ["setuptools>=77"]  # PEP 639 licence expression
build-backend = "setuptools.build_meta"

[project]
name = "certin-bom"
version = "0.1.0"
description = "Generate, enrich and audit SBOM, CBOM, QBOM, AIBOM and HBOM against the CERT-In Technical Guidelines v2.0"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.scripts]
certin-bom = "certin_bom.cli:main"

[tool.setuptools]
packages = ["certin_bom", "certin_bom.templates"]

[tool.setuptools.package-data]
"certin_bom.templates" = ["*.json"]
